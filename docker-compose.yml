version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: backtester-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: backtester
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./setup-database.sql:/docker-entrypoint-initdb.d/01-setup.sql
    networks:
      - backtester-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d backtester"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: backtester-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backtester-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: redis-server --appendonly yes

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backtester-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "9229:9229"  # Debug port
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=user
      - DB_PASSWORD=password
      - DB_DATABASE=backtester
      - REDIS_URL=redis://redis:6379
      - GPU_SERVICE_URL=http://gpu-service:6000
      - DISABLE_GPU_SERVICE=false
      - LOG_LEVEL=info
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/public:/app/public
    networks:
      - backtester-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      retries: 3
      start_period: 60s
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # GPU Service
  gpu-service:
    build:
      context: ./gpu-service
      dockerfile: Dockerfile
    container_name: backtester-gpu-service
    restart: unless-stopped
    ports:
      - "6000:6000"   # API port
      - "9090:9090"   # Metrics port
    environment:
      - NODE_ENV=production
      - PORT=6000
      - METRICS_PORT=9090
      - METRICS_ENABLED=true
      - LOG_LEVEL=info
      - BACKEND_URL=http://backend:5000
      - HEALTH_CHECK_INTERVAL=30000
      - GRACEFUL_SHUTDOWN_TIMEOUT=10000
      - CIRCUIT_BREAKER_THRESHOLD=5
      - CIRCUIT_BREAKER_TIMEOUT=60000
      - RATE_LIMIT_WINDOW=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - GPU_MAX_CONCURRENT_TASKS=4
      - GPU_TASK_TIMEOUT=120000
      - GPU_MEMORY_LIMIT=4096
    volumes:
      - ./gpu-service/logs:/app/logs
    networks:
      - backtester-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6000/health"]
      interval: 30s
      retries: 3
      start_period: 40s
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: backtester-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    networks:
      - backtester-network
    depends_on:
      backend:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  backtester-network:
    driver: bridge









