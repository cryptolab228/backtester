version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backtester-backend
    restart: unless-stopped
    ports:
      - "5000:5000" # Маппинг порта backend
    volumes:
      - ./backend/src:/app/src # Монтируем src для live reload в разработке (если используется ts-node-dev или аналог вне Docker)
      - ./backend/logs:/app/logs # Монтируем папку логов
      # - ./backend/.env:/app/.env # Монтируем .env файл
    environment:
      # Переменные окружения можно задать здесь или в .env файле
      NODE_ENV: production # Изменено на production для работы внутри Docker
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: user
      DB_PASSWORD: password
      DB_DATABASE: backtester_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - db
      - redis
    networks:
      - backtester-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: backtester-frontend
    restart: unless-stopped
    ports:
      - "8080:80" # Маппинг порта frontend (Nginx)
    # volumes:
      # - ./frontend/src:/app/src # Монтирование src для разработки Vue не всегда нужно/удобно с Nginx
    depends_on:
      - backend # Frontend может зависеть от backend для API запросов
    networks:
      - backtester-net

  db:
    image: timescale/timescaledb:latest-pg14 # Используем образ TimescaleDB
    container_name: backtester-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: backtester_db
    volumes:
      - postgres_data:/var/lib/postgresql/data # Сохраняем данные PostgreSQL
    ports:
      - "5432:5432" # Маппинг порта PostgreSQL (для внешнего доступа при необходимости)
    networks:
      - backtester-net

  redis:
    image: redis:alpine
    container_name: backtester-redis
    restart: unless-stopped
    ports:
      - "6379:6379" # Маппинг порта Redis (для внешнего доступа при необходимости)
    volumes:
      - redis_data:/data # Сохраняем данные Redis
    networks:
      - backtester-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  backtester-net:
    driver: bridge 