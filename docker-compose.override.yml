services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/dist
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
    working_dir: /app
  backend:
    environment:
      - NODE_ENV=development